<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Website</title>

    <!-- css external-->
    <link rel="stylesheet" href="./css/style.css" />

    <!-- bootstrap css-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>

  <body>
    <!--navbar-->
    <nav class="navbar navbar-expand-lg navbar-custom">
      <div class="container-fluid">
        <a
          class="navbar-brand d-flex align-items-center gap-2 text-dark"
          href="#"
        >
          <i class="fa-solid fa-wallet"></i>
          <span>Expense Tracker</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </nav>

    <main class="expense-container">
      <section class="card form-card">
        <h2>Add Expense</h2>

        <p id="errorMessage" class="error-message"></p>

        <form id="expenseForm">
          <label for="expenseName"> Expense Name </label>

          <input type="text" id="expenseName" placeholder="Example: Lunch" />

          <label for="expenseAmount"> Amount (Rp) </label>

          <input
            type="number"
            id="expenseAmount"
            placeholder="Example: 25000"
          />

          <button type="submit" class="save-button">Save Data</button>
        </form>
      </section>

      <section class="card list-card">
        <div class="list-header">
          <h2>Expense List</h2>

          <span id="totalExpense"> Rp 0 </span>
        </div>

        <p id="emptyMessage" class="empty-message">No expense data yet.</p>

        <ul id="expenseList"></ul>

        <div class="clear-section">
          <button type="button" id="clearAllButton" class="clear-button">
            Clear All
          </button>
        </div>
      </section>
    </main>

    <script src="./scripts/index.js"></script>
  </body>
</html>
